model: dnn
target: drtn_1m
target_transform: gauss
min_obs_frac: 0.5
features:
  factors: all
  max_sentinel_frac: 0.5
  lags:
  - 3
  - 12
  change_lags:
  - 3
  - 12
  lag_factors:
  - mom1
  - mom12
  - mom12_1
  - vola60
  - tover
  - illiq
  - bp_act
  - ep_act
  - ep_est
  - roe_act
  - rev1r
  - rev3r
  - dp_act
  - fcfp
  change_factors:
  - bp_act
  - ep_act
  - ep_est
  - roe_act
  - roa_act
  - prof
  - ni_ta
  - sales_grw
  - td_ta
  - dp_act
  - fcfp
  - doe
  rank: uniform
walkforward:
  first_retrain: '2012-12-31'
  retrain_every: 12
  window: expanding
  train_start: '2007-01-31'
  val_months: 12
  embargo_months: null
params:
  hidden:
  - 64
  - 32
  dropout: 0.2
  input_noise: 0.05
  activation: gelu
  lr: 0.001
  weight_decay: 0.0001
  dates_per_batch: 16
  max_epochs: 200
  patience: 20
  mse_weight: 0.0
  seeds: 5
  device: cpu
eval:
  targets:
  - drtn_1m
  - drtn_1m_s1
  - drtn_1m_s2
  - srtn_1m
  - drtn_3m
  spread_target: drtn_1m
  n_quantiles: 5
