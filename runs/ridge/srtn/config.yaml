  - 12
  change_lags:
  - 3
  - 12
  lag_factors:
  - mom1
  - mom12
  - mom12_1
  - vola60
  - tover
  - illiq
  - bp_act
  - ep_act
  - ep_est
  - roe_act
  - rev1r
  - rev3r
  - dp_act
  - fcfp
