model: lgbm
target: drtn_1m
target_transform: gauss
sector_level: sector
min_obs_frac: 0.5
features:
  factors: all
  max_sentinel_frac: 0.5
  lags:
  - 3
  - 12
  change_lags:
  - 3
  - 12
  lag_factors:
  - mom1
  - mom12
  - mom12_1
  - vola60
  - tover
  - illiq
  - bp_act
  - ep_act
  - ep_est
  - roe_act
  - rev1r
  - rev3r
  - dp_act
  - fcfp
  change_factors:
  - bp_act
  - ep_act
  - ep_est
  - roe_act
  - roa_act
  - prof
  - ni_ta
  - sales_grw
  - td_ta
  - dp_act
  - fcfp
  - doe
  rank: uniform
walkforward:
  first_retrain: '2012-12-31'
  retrain_every: 12
  window: expanding
  train_start: '2007-01-31'
  val_months: 12
  embargo_months: null
params:
  objective: regression
  n_bins: 10
  num_boost_round: 2000
  early_stopping_rounds: 200
  lgb:
    learning_rate: 0.02
    num_leaves: 15
    min_data_in_leaf: 100
    feature_fraction: 0.5
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 10.0
eval:
  targets:
  - drtn_1m
  - gp_trtn_1m
  - drtn_1m_s1
  - drtn_1m_s2
  - drtn_3m
  - srtn_1m
  spread_target: drtn_1m
  n_quantiles: 5
